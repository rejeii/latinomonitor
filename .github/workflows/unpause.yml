name: Despausar Produtos Notion

on:
  workflow_dispatch: {}

jobs:
  unpause:
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm ci
      - name: Despausar produtos
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_IDS: ${{ secrets.NOTION_DATABASE_IDS }}
          DISCORD_WEBHOOK_PRECOS: ${{ secrets.DISCORD_WEBHOOK_PRECOS }}
        run: node scripts/unpause-all.js
