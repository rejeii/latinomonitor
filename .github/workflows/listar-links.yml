name: Listar Links Antigos Notion

on:
  workflow_dispatch: {}

jobs:
  listar:
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm ci
      - name: Listar links antigos
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_IDS: ${{ secrets.NOTION_DATABASE_IDS }}
        run: node scripts/listar-links-antigos.js
