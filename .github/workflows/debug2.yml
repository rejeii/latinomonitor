name: Debug Checked Products
on: [push]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug Script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_IDS: ${{ secrets.NOTION_DATABASE_IDS }}
        run: |
          cat << 'EOF' > debug.js
          const NOTION_TOKEN = process.env.NOTION_TOKEN;
          const DB_IDS = (process.env.NOTION_DATABASE_IDS || '').split(',').map(id => id.trim()).filter(Boolean);

          async function run() {
            if (!DB_IDS.length) return;
            
            for (const dbId of DB_IDS) {
              let cursor = undefined;
              do {
                const res = await fetch(`https://api.notion.com/v1/databases/${dbId}/query`, {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${NOTION_TOKEN}`,
                    'Notion-Version': '2022-06-28',
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({ start_cursor: cursor, page_size: 100 })
                });
                if (!res.ok) break;
                const json = await res.json();
                
                for (const page of json.results) {
                  const props = page.properties;
                  const nameProp = Object.values(props).find(p => p.type === 'title');
                  const name = nameProp?.title?.[0]?.plain_text || 'Unnamed';
                  
                  const ignorarMargem = Object.keys(props)
                    .filter(k => k.toLowerCase().replace(/[^a-z]/g, '') === 'ignorarmargem')
                    .some(k => props[k]?.checkbox);
                    
                  if (ignorarMargem) {
                    console.log(`[CHECKED] DB: ${dbId} | Product: ${name}`);
                  }
                }
                cursor = json.has_more ? json.next_cursor : null;
              } while (cursor);
            }
          }
          run();
          EOF
          node debug.js
