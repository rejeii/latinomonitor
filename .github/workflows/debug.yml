name: Debug Notion Properties
on: [push]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug Script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_IDS: ${{ secrets.NOTION_DATABASE_IDS }}
        run: |
          cat << 'EOF' > debug.js
          const NOTION_TOKEN = process.env.NOTION_TOKEN;
          const DB_IDS = (process.env.NOTION_DATABASE_IDS || '').split(',').map(id => id.trim()).filter(Boolean);

          async function run() {
            if (!DB_IDS.length) {
              console.log("No DB_IDS found");
              return;
            }
            
            for (const dbId of DB_IDS) {
              const res = await fetch(`https://api.notion.com/v1/databases/${dbId}/query`, {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${NOTION_TOKEN}`,
                  'Notion-Version': '2022-06-28',
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({ page_size: 5 })
              });
              
              if (!res.ok) {
                console.log("Error fetching DB", dbId, await res.text());
                continue;
              }
              
              const json = await res.json();
              if (json.results && json.results.length > 0) {
                console.log("DB", dbId, "FIRST PAGE PROPERTIES:");
                const props = json.results[0].properties;
                const ignorarKeys = Object.keys(props).filter(k => k.toLowerCase().includes('ignorar'));
                for (const k of ignorarKeys) {
                   console.log(`Key: "${k}"`);
                   console.log(JSON.stringify(props[k], null, 2));
                }
                console.log("--------------------------------------------------");
              }
            }
          }
          run();
          EOF
          node debug.js
