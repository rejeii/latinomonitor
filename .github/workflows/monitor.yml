name: LatinoGG Monitor

on:
  # Agendamento é EXTERNO (cron-job.org dispara via workflow_dispatch a cada 6h).
  # Isso evita o auto-disable de 60 dias do schedule nativo do GitHub.
  workflow_dispatch: {}   # botão "Run workflow" na aba Actions + disparo do cron-job.org

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Rodar monitor
        env:
          NOTION_TOKEN:              ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_IDS:       ${{ secrets.NOTION_DATABASE_IDS }}
          DISCORD_WEBHOOK_PRECOS:    ${{ secrets.DISCORD_WEBHOOK_PRECOS }}
          DISCORD_WEBHOOK_ESGOTADOS: ${{ secrets.DISCORD_WEBHOOK_ESGOTADOS }}
          DISCORD_WEBHOOK_INICIO:    ${{ secrets.DISCORD_WEBHOOK_INICIO }}
          PRICE_THRESHOLD:           ${{ vars.PRICE_THRESHOLD }}
        run: npm start
