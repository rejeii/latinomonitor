name: LatinoGG Monitor

on:
  # Agendamento é EXTERNO (cron-job.org dispara via workflow_dispatch a cada 6h).
  # Isso evita o auto-disable de 60 dias do schedule nativo do GitHub.
  workflow_dispatch: {}   # botão "Run workflow" na aba Actions + disparo do cron-job.org

permissions:
  contents: read
  actions: read   # necessário pro aviso de minutos (lê os runs do mês)

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # >=22.9: necessário pro --env-file-if-exists do npm start
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Guarda o download do Chromium (~150 MB) entre runs — economiza 1-2 min
      # de minutos do Actions por execução. A chave muda quando a versão do
      # Playwright muda (via package-lock.json), forçando um download novo.
      - name: Cache do Chromium (Playwright)
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar Chromium (Playwright)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Com cache, o navegador já existe — só as libs de sistema precisam ser instaladas
      - name: Instalar dependências de sistema do Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Rodar monitor
        env:
          NOTION_TOKEN:              ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_IDS:       ${{ secrets.NOTION_DATABASE_IDS }}
          NOTION_ERROR_DB_ID:        ${{ vars.NOTION_ERROR_DB_ID }}
          DISCORD_WEBHOOK_PRECOS:    ${{ secrets.DISCORD_WEBHOOK_PRECOS }}
          DISCORD_WEBHOOK_ESGOTADOS: ${{ secrets.DISCORD_WEBHOOK_ESGOTADOS }}
          DISCORD_WEBHOOK_INICIO:    ${{ secrets.DISCORD_WEBHOOK_INICIO }}
          DISCORD_WEBHOOK_ERROS:     ${{ secrets.DISCORD_WEBHOOK_ERROS }}
          PRICE_THRESHOLD:           ${{ vars.PRICE_THRESHOLD }}
          PRICE_THRESHOLD_HIGH:      ${{ vars.PRICE_THRESHOLD_HIGH }}
          PRICE_HIGH_LEVEL:          ${{ vars.PRICE_HIGH_LEVEL }}
          ACTIONS_LIMIT_MIN:         ${{ vars.ACTIONS_LIMIT_MIN }}
          ACTIONS_ALERT_PCT:         ${{ vars.ACTIONS_ALERT_PCT }}
          GH_TOKEN:                  ${{ github.token }}
          GH_REPO:                   ${{ github.repository }}
        run: npm start

      # Avisa no Discord se QUALQUER passo acima falhar (npm/playwright/node/infra)
      - name: Avisar falha no Discord
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_INICIO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then exit 0; fi
          curl -s -X POST "$WEBHOOK" -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ LatinoGG Monitor — run FALHOU\",\"description\":\"Um passo do workflow falhou. [Ver logs do run]($RUN_URL)\",\"color\":15158332}]}"
